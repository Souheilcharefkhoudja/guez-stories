name: Insta story
on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "30 9 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "30 13 * * *"
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "30 18 * * *"
    - cron: "0 20 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: story
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python post.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID: ${{ secrets.IG_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -m "state" && git push || true
