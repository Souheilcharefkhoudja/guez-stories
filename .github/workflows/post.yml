name: Insta story
on:
  schedule:
    # 10 posts/jour (heures UTC -> Alger = UTC+1) : 9h,10h30,12h,13h,14h30,16h,18h,19h30,21h,22h30
    - cron: "0 8 * * *"
    - cron: "30 9 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "30 13 * * *"
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "30 18 * * *"
    - cron: "0 20 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python post.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID: ${{ secrets.IG_ID }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add state.json && git commit -m "next photo" && git push || true
